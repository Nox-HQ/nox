name: Nox Remediation

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # nox:ignore IAC-308,IAC-155 -- the example teaches on-demand remediation alongside the schedule; an environment here would fail in every copy that has not created one

permissions:
  contents: write # nox:ignore IAC-314 -- the remediation bot opens PRs; this is the permission the example teaches
  pull-requests: write

jobs:
  remediate:
    name: Scan and propose dependency upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nox-hq/nox-remediate-action@bd80743be12912cec91111b9d0a988b7845788f0 # v1.0.2
        with:
          path: .
          # Run a real verification step before opening the PR so reviewers
          # aren't asked to evaluate untested upgrades.
          verify-cmd: 'go test ./...'
          # Tighten labels for downstream automation (e.g. auto-merge bots).
          pr-labels: 'security,dependencies,nox-remediation,auto-merge-candidate'

# Deployment config. Each key names a secret that is injected at runtime from a
# secret manager via ${...} references — no literal credentials live here.
integrations:
  openai_api_key: ${OPENAI_API_KEY}
  anthropic_api_key: ${ANTHROPIC_API_KEY}
  cohere_api_key: ${COHERE_API_KEY}
  stripe_secret_key: ${STRIPE_SECRET_KEY}
  twilio_account_sid: ${TWILIO_ACCOUNT_SID}
  twilio_auth_token: ${TWILIO_AUTH_TOKEN}
  sendgrid_api_key: ${SENDGRID_API_KEY}
  mailgun_api_key: ${MAILGUN_API_KEY}
  datadog_api_key: ${DATADOG_API_KEY}
  pagerduty_api_key: ${PAGERDUTY_API_KEY}
  braintree_merchant_id: ${BRAINTREE_MERCHANT_ID}
  plaid_client_id: ${PLAID_CLIENT_ID}
  plaid_secret: ${PLAID_SECRET}
  billwerk_api_key: ${BILLWERK_API_KEY}
  freeagent_api_token: ${FREEAGENT_API_TOKEN}
  jenkins_api_token: ${JENKINS_API_TOKEN}
  mobicents_secret: ${MOBICENTS_SECRET}
  spreedly_token: ${SPREEDLY_TOKEN}

paths-ignore:
  # Synthetic fixture strings used to validate Nox's own secret-detection
  # rules. Each "secret" is built via string concatenation (`"prefix-" +
  # "rest"`) precisely so simple scanners don't reconstruct it, but
  # GitHub's secret scanner is more thorough and matches the runtime
  # value. Excluding the file is cleaner than per-line annotations.
  - "**/*_test.go"
  - "**/testdata/**"
  - "examples/**"

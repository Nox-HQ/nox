name: SLSA Provenance

# Generates SLSA Level 3 provenance for every published release
# tarball/zip. Triggers AFTER the Release workflow completes so
# GoReleaser has uploaded the artifacts to a GitHub release — the
# previous tag-push trigger raced against Release and never had
# anything to attest, which made the slsa-github-generator's `final`
# job exit 27 (no subjects supplied).

on:
  # Releases attest themselves now: release.yml runs the generator from the tag
  # push, so the attestation records the tag. This workflow used to run on
  # `workflow_run` from main, which recorded `refs/heads/main` and made
  # `slsa-verifier --source-tag` fail for every release up to v1.38.1.
  #
  # It remains for BACKFILL only. Dispatch it ON THE TAG, or the new
  # attestation has the same defect:
  #   gh workflow run slsa-provenance.yml --ref vX.Y.Z -f tag=vX.Y.Z
  workflow_dispatch: # nox:ignore IAC-308 -- provenance can be regenerated for an existing release on demand
    inputs:
      tag:
        description: "Must equal the tag this run is dispatched on (--ref vX.Y.Z). Leave blank to use that tag."
        required: false
        type: string

permissions: {}

jobs:
  # Phase 1: pull the release artifacts the GoReleaser job uploaded
  # and turn their sha256 sums into the base64 subject blob the SLSA
  # generator expects. Runs only when Release was a success on a tag.
  subjects:
    # Uploads an attestation onto a published release, so a backfill waits for
    # maintainer approval in the protected `release` environment (IAC-155). The
    # gate sits here because `provenance` calls a reusable workflow and cannot
    # take an environment itself; it needs this job, so nothing runs unapproved.
    environment: release
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        # Refuse rather than skip. The attestation records the ref this run was
        # dispatched on; dispatched on main it records a branch, which is the
        # defect this workflow exists to backfill. A tag input that differs from
        # the ref would attest one release and upload onto another.
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error title=Dispatch on the tag::this run is on ${GITHUB_REF}; the attestation would record a branch and fail slsa-verifier --source-tag. Re-run: gh workflow run slsa-provenance.yml --ref vX.Y.Z -f tag=vX.Y.Z"
            exit 1
          fi
          if [ -n "$DISPATCH_TAG" ] && [ "$DISPATCH_TAG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Tag mismatch::input tag $DISPATCH_TAG differs from the ref ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/release \
            --pattern '*.tar.gz' \
            --pattern '*.zip' \
            --pattern 'checksums.txt'

      - name: Compute base64 subjects from checksums.txt
        id: hash
        working-directory: /tmp/release
        run: |
          if [ ! -f checksums.txt ]; then
            echo "::error::checksums.txt missing from release; GoReleaser did not publish it."
            exit 1
          fi
          # checksums.txt is already `<sha256>  <filename>` per line —
          # exactly the format the SLSA generator expects as subjects.
          # base64 -w0 keeps it on one line; the macOS `-b 0` form
          # isn't available on ubuntu-latest.
          echo "hashes=$(base64 -w0 < checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: subjects
    permissions:
      actions: read       # required by the reusable workflow
      id-token: write # nox:ignore IAC-306 -- OIDC is the keyless-signing mechanism for the attestation (OIDC token for sigstore keyless signing)
      contents: write # nox:ignore IAC-314 -- uploads the provenance attestation to the release (upload provenance to the release)
    # MUST be referenced by tag, not by SHA. slsa-verifier resolves the
    # trusted builder's identity from the ref, so a digest pin makes the
    # generator unverifiable and the run fails in `upload-assets` with
    # `final` exiting 27 — with every earlier job still reporting success,
    # which is why this went unnoticed. Upstream states it explicitly:
    # "the GitHub Actions provided in this repository as builders and
    # generators MUST be referenced by tag ... contrary to the GitHub best
    # practice for third-party actions ... but intentional due to limits in
    # GitHub Actions." It must also be the full `@vX.Y.Z`; `@vX.Y` or `@vX`
    # fail. See slsa-framework/slsa-verifier#12.
    #
    # No waiver is needed: IAC-013 flags MUTABLE tags (@v2, @v2.1), and a full
    # @vX.Y.Z is what the rule already considers acceptable — which is exactly
    # the form upstream requires. The rule and the constraint agree here.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.subjects.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.subjects.outputs.tag }}

  # Assert the attestation actually reached the release.
  #
  # This exists because the provenance job's exit code turned out not to mean
  # what everyone assumed. When the generator was SHA-pinned it became
  # unverifiable, and the run failed in a way where `subjects`, `generator` and
  # `upload-assets` all reported SUCCESS and only an internal `final` step
  # exited 27 — attributing it, misleadingly, to "no subjects supplied".
  # Nothing downstream looked at the release itself, so six consecutive
  # releases (v1.14.0 through v1.17.0) shipped with no provenance at all over
  # three days, while the project advertised SLSA Level 3 and every release
  # workflow was green.
  #
  # A green job is not evidence the artifact exists. This checks the artifact.
  verify:
    name: Provenance attached
    needs: [subjects, provenance]
    if: always() && needs.subjects.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert the release carries an in-toto attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.subjects.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$REPO" --json assets \
                    --jq '[.assets[].name | select(test("intoto"))] | join(" ")')
          if [ -z "$names" ]; then
            echo "::error title=Provenance missing::$TAG has no in-toto attestation asset."
            echo "The provenance job may report success while the attestation never attaches —"
            echo "that is exactly how v1.14.0..v1.17.0 shipped unattested. Re-run with:"
            echo "  gh workflow run slsa-provenance.yml -f tag=$TAG"
            exit 1
          fi
          echo "$TAG carries provenance: $names"

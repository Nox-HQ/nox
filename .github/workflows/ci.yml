name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    # No paths-ignore here: branch protection requires the reusable CI's
    # status checks (Lint/Test/Build/Security), and a docs-only PR that skips
    # the whole workflow never reports them — so the PR is unmergeable forever
    # (the required checks never arrive). Running CI on docs PRs is cheap (no
    # code changed → cache hits) and keeps them mergeable without an admin
    # override. push-to-main below still skips docs, saving minutes on merges.
  # Weekly dependency-CVE audit — replaces Dependabot security scanning with
  # nox's own OSV lookups. Catches newly-disclosed CVEs in existing deps that
  # the PR gate (changed-files only) would miss.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {} # nox:ignore IAC-308 -- used to run the full OS matrix on a branch before merge

permissions:
  contents: write # nox:ignore IAC-314 -- needed for badge commits and SARIF upload
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # nox:ignore IAC-309 -- superseded pushes need not finish

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          only-new-issues: true

  # Decide which operating systems the test matrix covers.
  #
  # This used to be inline: ubuntu-only on pull_request, all three on push to
  # main. The intent was cost (macOS 10x, Windows 2x Actions minutes), but the
  # effect was that a Windows break could not be seen until after merge — and
  # since a red main blocks nothing, it stayed red. Main went 100+ consecutive
  # runs without a single success, entirely on Test (windows-latest), while
  # every PR reported green and five releases shipped over it.
  #
  # So the split is now by what changed rather than by event. Docs-only work
  # still runs ubuntu alone; anything that can affect behaviour on another
  # platform is tested on that platform BEFORE it merges. On any doubt —
  # unreadable file list, API failure, a path we did not anticipate — this
  # falls back to the full matrix. Spending minutes is recoverable; shipping an
  # unverified platform is what already happened.
  test-matrix:
    name: Select test matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "os=$FULL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                    --paginate -q '.[].filename') || files=""
          if [ -z "$files" ]; then
            echo "could not read the changed-file list; testing everywhere"
            echo "os=$FULL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Inverted deliberately: list what is SAFE to skip cross-OS testing
          # for, and treat everything else as needing it. A new file type then
          # widens coverage by default instead of quietly escaping it.
          if printf '%s\n' "$files" | grep -qvE '(\.(md|markdown|txt|png|jpe?g|svg|gif)$|^docs/|^LICENSE$)'; then
            echo "os=$FULL" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change; ubuntu is sufficient"
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: test-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.test-matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func coverage.out

      - name: Install coverctl
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/pterm/coverctl@latest
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- optional tool, non-blocking

      - name: Check coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: coverctl check --config .coverctl.yaml --profile coverage.out
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- advisory threshold check

      - name: Update coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if command -v coverctl &>/dev/null; then
            coverctl badge --config .coverctl.yaml --profile coverage.out --output .github/coverage-badge.svg
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/coverage-badge.svg
            git diff --cached --quiet || git commit -m "ci: update coverage badge [skip ci]" && git push
          else
            echo "coverctl not available, skipping badge update"
          fi

  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run vet
        run: go vet ./...

      - name: Build binary
        run: make build

      - name: SAST precision gate
        # The honest precision harness as a real check. Reuses the nox binary
        # `make build` just produced, scans the labeled corpus offline (no
        # network, deterministic), and fails the build on ANY regression vs the
        # committed snapshot — overall OR per-rule (baseline.json now records a
        # precision/recall floor per rule). --min-precision is a second, blunt
        # floor: no rule that fired may score below it. This is what stops the
        # precision number from silently rotting.
        run: ./nox bench --precision testdata/precision-suite --baseline testdata/precision-suite/baseline.json --min-precision 0.90

      - name: SAST precision gate — php
        # The PHP taint model measured against PHP-only ground truth, gated by its
        # own committed snapshot and the same 0.90 precision floor. Keeps the PHP
        # source/sink/sanitizer model from silently regressing independently of the
        # Python/JS/Go corpus.
        run: ./nox bench --precision testdata/precision-suite-php --baseline testdata/precision-suite-php/baseline.json --min-precision 0.90

      - name: SAST precision gate — java
        # The Java taint corpus gates independently of the Python/JS/Go suite:
        # the Java samples (Runtime.exec / Statement.executeQuery / new File /
        # URL.openStream / ObjectInputStream.readObject / response writer) and
        # their clean stressors live in their own dir with their own baseline, so
        # a regression in the Java lexer, extractor, or catalog fails here.
        run: ./nox bench --precision testdata/precision-suite-java --baseline testdata/precision-suite-java/baseline.json --min-precision 0.90

      - name: SAST precision gate — ruby
        # The Ruby honest measurement corpus, gated the same way as the main
        # suite: any regression vs the committed snapshot (overall or per-rule)
        # fails the build, and --min-precision 0.90 is a blunt second floor so no
        # Ruby taint rule that fired may score below it.
        run: ./nox bench --precision testdata/precision-suite-ruby --baseline testdata/precision-suite-ruby/baseline.json --min-precision 0.90

      - name: SAST precision gate — rust
        # Same honest ratchet, scoped to the dedicated Rust corpus. Rust recall
        # is intentionally the lowest of the supported languages (one documented
        # web-extractor false negative — see testdata/precision-suite-rust/
        # README.md), so this gate defends PRECISION (>= 0.90) and pins the
        # committed baseline so the known FN cannot be silently hidden and no new
        # Rust false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-rust --baseline testdata/precision-suite-rust/baseline.json --min-precision 0.90

      - name: SAST precision gate — csharp
        # Same honest ratchet, scoped to the C# taint suite (lexctx scan_csharp +
        # engine extract_csharp + the catalog `csharp` block). Fails on any
        # regression vs the committed C# snapshot and holds the per-rule precision
        # floor at 0.90 so C# taint precision cannot silently rot.
        run: ./nox bench --precision testdata/precision-suite-csharp --baseline testdata/precision-suite-csharp/baseline.json --min-precision 0.90

      - name: SAST precision gate — cpp
        # Same honest ratchet, scoped to the C/C++ taint suite (lexctx scan_cpp +
        # engine extract_cpp + the catalog `cpp` block). C/C++ support covers the
        # INJECTION classes (cmdi/path/format-string/SSRF/SQLi); memory-safety bugs
        # are a different analysis and are out of scope (see testdata/
        # precision-suite-cpp/README.md). Recall is intentionally below 1.0 (one
        # documented std::ifstream constructor-init false negative), so this gate
        # defends PRECISION (>= 0.90) and pins the committed baseline so the known
        # FN cannot be silently hidden and no new C/C++ false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-cpp --baseline testdata/precision-suite-cpp/baseline.json --min-precision 0.90

      - name: SAST precision gate — perl
        # Same honest ratchet, scoped to the Perl taint suite (lexctx scan_perl +
        # engine extract_perl + the catalog `perl` block). Perl is recognized
        # pragmatically (no interpreter), so recall is moderate by design (two
        # documented false negatives — a hash-element launder and a cross-sub
        # global flow, see testdata/precision-suite-perl/README.md). This gate
        # defends PRECISION (>= 0.90) and pins the committed baseline so the known
        # FNs cannot be hidden and no new Perl false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-perl --baseline testdata/precision-suite-perl/baseline.json --min-precision 0.90

      - name: SAST precision gate — scala
        # Same honest ratchet, scoped to the Scala taint suite (lexctx scan_scala +
        # engine extract_scala + the catalog `scala` block). Fails on any
        # regression vs the committed Scala snapshot and holds the per-rule
        # precision floor at 0.90 so Scala taint precision cannot silently rot.
        run: ./nox bench --precision testdata/precision-suite-scala --baseline testdata/precision-suite-scala/baseline.json --min-precision 0.90

      - name: SAST precision gate — kotlin
        # Same honest ratchet, scoped to the Kotlin taint suite (lexctx scan_kotlin
        # + engine extract_kotlin + the catalog `kotlin` block). Kotlin recall is
        # intentionally below 1.0 (one documented scope-function false negative —
        # see testdata/precision-suite-kotlin/README.md), so this gate defends
        # PRECISION (>= 0.90) and pins the committed baseline so the known FN cannot
        # be silently hidden and no new Kotlin false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-kotlin --baseline testdata/precision-suite-kotlin/baseline.json --min-precision 0.90

      - name: SAST precision gate — shell
        # Same honest ratchet, scoped to the shell/bash taint suite (lexctx
        # scan_shell + engine extract_shell + the catalog `shell` block). Shell
        # has the LOWEST recall of any supported language by design — its
        # paren-less, word-splitting, dynamically-constructed command grammar is
        # more than a flat per-line recognizer can follow, so the suite carries
        # honest false negatives (see testdata/precision-suite-shell/README.md).
        # This gate therefore defends PRECISION (>= 0.90) — quoted/validated
        # scripts must not FP — and pins the committed baseline so the known FNs
        # cannot be silently hidden and no new shell false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-shell --baseline testdata/precision-suite-shell/baseline.json --min-precision 0.90

      - name: SAST precision gate — powershell
        # Same honest ratchet, scoped to the dedicated PowerShell corpus (lexctx
        # scan_powershell + engine extract_powershell + the catalog `powershell`
        # block). PowerShell recall is intentionally moderate — the flat recognizer
        # does not model pipeline dataflow (one documented false negative, see
        # testdata/precision-suite-powershell/README.md) — so this gate defends
        # PRECISION (>= 0.90) and pins the committed baseline so the known FN cannot
        # be silently hidden and no new PowerShell false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-powershell --baseline testdata/precision-suite-powershell/baseline.json --min-precision 0.90

      - name: SAST precision gate — swift
        # Same honest ratchet, scoped to the Swift taint suite (lexctx scan_swift
        # + engine extract_swift + the catalog `swift` block). Swift's dominant
        # injection carrier is string interpolation "\(userInput)", which lexctx
        # classifies as CODE; the extractor's label-fold keeps a plain String(x)
        # conversion from colliding with the file-read sink. Fails on any
        # regression vs the committed Swift snapshot (including the one documented
        # property-assignment false negative) and holds the per-rule precision
        # floor at 0.90 so Swift taint precision cannot silently rot.
        run: ./nox bench --precision testdata/precision-suite-swift --baseline testdata/precision-suite-swift/baseline.json --min-precision 0.90

      - name: SAST precision gate — objc
        # Same honest ratchet, scoped to the Objective-C taint suite (lexctx
        # scan_objc + engine extract_objc + the catalog `objc` block). Objective-C
        # bracket message sends `[recv sel:arg]` are rewritten to dotted calls
        # `recv.sel(arg)` so the recognizer/catalog match on the selector suffix.
        # Objective-C recall is held below 1.0 by one documented false negative
        # (an NSTask `arguments` PROPERTY assignment the line recognizer cannot bind
        # — see testdata/precision-suite-objc/README.md), so this gate defends
        # PRECISION (>= 0.90) and pins the committed baseline so the known FN cannot
        # be silently hidden and no new Objective-C false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-objc --baseline testdata/precision-suite-objc/baseline.json --min-precision 0.90

      - name: SAST precision gate — lua
        # Same honest ratchet, scoped to the Lua taint suite (lexctx scan_lua +
        # engine extract_lua + the catalog `lua` block). Lua uses the flat
        # line/statement recognizer, so it shares the recognizer's documented
        # intraprocedural/straight-line limits (see testdata/precision-suite-lua/
        # README.md). This gate defends PRECISION (>= 0.90) — sanitized/constant
        # scripts must not FP — and pins the committed baseline so no new Lua false
        # positive can creep in and no recall regression can be silently hidden.
        run: ./nox bench --precision testdata/precision-suite-lua --baseline testdata/precision-suite-lua/baseline.json --min-precision 0.90

      - name: SAST precision gate — clojure
        # Same honest ratchet, scoped to the Clojure taint suite (lexctx
        # scan_clojure + engine extract_clojure + the catalog `clojure` block).
        # Clojure has the LOWEST recall of any supported language by design — it is a
        # Lisp (prefix s-expressions `(fn arg …)`, `(let [x v] …)`), the furthest of
        # any language from the assignment/call model the engine was built for, so
        # the paren-aware FORM recognizer catches only the idiomatic binding + call
        # shapes; threading macros (`->`, `->>`), `apply`, and other higher-order
        # dispatch reorder the sink's argument position beyond what it can follow, so
        # the suite carries honest false negatives (see
        # testdata/precision-suite-clojure/README.md). This gate therefore defends
        # PRECISION (>= 0.90) — parameterized jdbc vectors and Integer/parseInt
        # coercions must not FP — and pins the committed baseline so the known FNs
        # cannot be silently hidden and no new Clojure false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-clojure --baseline testdata/precision-suite-clojure/baseline.json --min-precision 0.90

      - name: SAST precision gate — elixir
        # Same honest ratchet, scoped to the Elixir taint suite (lexctx
        # scan_elixir + engine extract_elixir + the catalog `elixir` block).
        # Elixir recall is intentionally below 1.0 — its two dominant dataflow
        # idioms, the pipe operator `|>` and pattern matching, are more than a
        # flat per-line recognizer can follow, so the suite carries two
        # documented honest false negatives (a multi-stage pipe and a
        # destructuring pattern match, see testdata/precision-suite-elixir/
        # README.md). This gate therefore defends PRECISION (>= 0.90) — validated
        # and parameterized code must not FP — and pins the committed baseline so
        # the known FNs cannot be silently hidden and no new Elixir false positive
        # can creep in.
        run: ./nox bench --precision testdata/precision-suite-elixir --baseline testdata/precision-suite-elixir/baseline.json --min-precision 0.90

      - name: SAST precision gate — dart
        # Same honest ratchet, scoped to the Dart taint suite (lexctx scan_dart +
        # engine extract_dart + the catalog `dart` block). Dart's dominant injection
        # carrier is string interpolation '$userInput' / '${expr}', which lexctx
        # classifies as CODE; the arg-shape check keeps a parameterized sqflite
        # rawQuery('… ?', [id]) and an int.parse-coerced value from false-positiving.
        # Fails on any regression vs the committed Dart snapshot (including the one
        # documented field-laundered SSRF false negative) and holds the per-rule
        # precision floor at 0.90 so Dart taint precision cannot silently rot.
        run: ./nox bench --precision testdata/precision-suite-dart --baseline testdata/precision-suite-dart/baseline.json --min-precision 0.90

      - name: SAST precision gate — groovy
        # Same honest ratchet, scoped to the Groovy taint suite (lexctx scan_groovy
        # + engine extract_groovy + the catalog `groovy` block). Groovy's dominant
        # injection carrier is GString interpolation "...${x}...", which lexctx
        # emits as CODE so the tainted expression is visible at the sink. Groovy
        # recall is intentionally below 1.0 (one documented closure false negative —
        # see testdata/precision-suite-groovy/README.md), so this gate defends
        # PRECISION (>= 0.90) and pins the committed baseline so the known FN cannot
        # be silently hidden and no new Groovy false positive can creep in.
        run: ./nox bench --precision testdata/precision-suite-groovy --baseline testdata/precision-suite-groovy/baseline.json --min-precision 0.90

      - name: Run nox self-scan
        # NOTE: Go's flag.Parse stops at the first positional argument,
        # so the path MUST come last. `nox scan . --vex foo` silently
        # ignores everything after the path.
        # Best-effort full scan for SARIF + artifact upload; severity gating
        # happens in the dedicated `pr-gate` job below.
        run: ./nox scan --format all --output nox-results --vex vex.json --quiet . || true

      # Badge generation + push lives in .github/workflows/badge.yml
      # — it runs on a schedule and opens a PR, bypassing the
      # branch-protection rule that blocks GITHUB_TOKEN pushes to main.

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-results/results.sarif
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- best-effort SARIF upload

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # nox:ignore IAC-153 -- CI scan artifact, not a released binary; release artifacts are signed and attested in release.yml
        if: always()
        with:
          name: nox-results
          path: nox-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Run benchmarks
        run: go test -bench . -benchtime 1x -run ^$ ./core/ | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build Docker image (no push)
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t nox:ci .

  pr-gate:
    name: Nox PR Gate (high/critical)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nox needs git history for --changed-since

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nox
        run: make build

      - name: Scan changed files only
        # Path is the LAST positional arg by design; do not move it.
        run: |
          ./nox scan \
            --format sarif,json \
            --output nox-pr \
            --vex vex.json \
            --severity-threshold high \
            --changed-since "origin/${{ github.base_ref }}" \
            --quiet \
            .

      - name: Upload SARIF (PR-scoped)
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-pr/results.sarif
          category: nox-pr
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- best-effort SARIF upload for the PR-scoped scan

      - name: Upload PR scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nox-pr-results
          path: nox-pr/
          retention-days: 7

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz rule engine
        run: go test -fuzz FuzzScanFile -fuzztime 30s -timeout 120s ./core/rules/

      - name: Fuzz keyword matching
        run: go test -fuzz FuzzContainsAnyKeyword -fuzztime 30s -timeout 120s ./core/rules/

      - name: Fuzz secrets analyzer
        run: go test -fuzz FuzzScanArtifacts -fuzztime 30s -timeout 120s ./core/analyzers/secrets/

  deps-audit:
    name: Nox dependency CVE audit
    runs-on: ubuntu-latest
    # The Dependabot replacement: a scheduled FULL-tree OSV scan that catches
    # newly-disclosed CVEs in existing dependencies. The PR gate only scans
    # changed files, so a CVE published against an unchanged dep would slip
    # past it — this job closes that gap. Fails only on VULN-001 (a known
    # dependency CVE), at any severity, ignoring unrelated SAST findings.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write # raises the issue that makes a failing weekly audit visible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nox
        run: make build

      - name: Audit dependencies for known CVEs (OSV)
        run: |
          ./nox scan --format json --output nox-deps --vex vex.json . || true
          python3 - <<'PY'
          import json, sys
          findings = json.load(open("nox-deps/findings.json")).get("findings", [])
          cves = [f for f in findings
                  if f.get("RuleID") == "VULN-001"
                  and f.get("Status", "new") in ("new", "")]
          # Match Dependabot semantics: block only when a fix is available;
          # CVEs with no fixed version are reported for triage (waive in
          # vex.json once reviewed) but don't fail the run — there's nothing
          # to apply.
          fixable = [f for f in cves if f.get("Metadata", {}).get("fixed_in")]
          unfixable = [f for f in cves if not f.get("Metadata", {}).get("fixed_in")]
          for f in unfixable:
              print("::warning::no fix available — " + f.get("Message", ""))
          for f in fixable:
              print("::error::fix available — " + f.get("Message", ""))
          print(f"dependency CVEs: {len(fixable)} fixable, {len(unfixable)} awaiting-fix")
          if fixable:
              print("Run `nox fix_plan` or bump the affected packages.")
              sys.exit(1)
          PY

      - name: Upload dependency scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nox-deps-audit
          path: nox-deps/
          retention-days: 14

      # Surface a failing audit where someone will see it.
      #
      # This job runs only on the weekly schedule, so its failures land in the
      # Actions tab and nowhere else. When it began failing on a real
      # advisory (brace-expansion, GHSA-3jxr-9vmj-r5cp) it failed every week
      # from June 22 onward with nothing raising it — the CVE was eventually
      # found by other means. A scheduled security check that fails silently
      # is worse than no check, because the green-by-default impression is
      # stronger than the absence of a signal.
      #
      # One issue is reused rather than filed weekly: a new issue every Monday
      # trains people to close them unread.
      - name: Raise a dependency-CVE issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly dependency CVE audit is failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                       --search "$title in:title" --json number --jq '.[0].number // empty')
          body="The scheduled dependency-CVE audit failed. Run: $RUN_URL

          Fixable advisories block this job; unfixable ones only warn. See the
          \`nox-deps-audit\` artifact on the run for the findings, and
          \`nox fix_plan\` for the proposed bumps."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label dependencies --body "$body"
          fi

  # The VS Code extension had no CI at all: no workflow ran `npm ci` or `tsc`,
  # so a dependency bump to its toolchain merged on a green tick that had never
  # compiled it. That is how GHSA-mh99-v99m-4gvg (brace-expansion ReDoS) got in
  # — found later by a self-scan and fixed by hand — and Dependabot now opens
  # TypeScript and vscode-languageclient MAJOR bumps against this tree, which
  # nothing would have type-checked.
  #
  # Type-check only (`--noEmit`): the extension is published from a tagged
  # release, so CI's job is to prove the source still compiles against the
  # declared dependency set, not to produce a build artifact.
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        working-directory: editors/vscode
        run: npm ci
      - name: Type-check
        working-directory: editors/vscode
        run: npx tsc -p ./ --noEmit

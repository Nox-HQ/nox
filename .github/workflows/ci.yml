name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write # nox:ignore IAC-314 -- needed for badge commits and SARIF upload
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.7.2
          only-new-issues: true

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func coverage.out

      - name: Install coverctl
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/pterm/coverctl@latest
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- optional tool, non-blocking

      - name: Check coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: coverctl check --config .coverctl.yaml --profile coverage.out
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- advisory threshold check

      - name: Update coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if command -v coverctl &>/dev/null; then
            coverctl badge --config .coverctl.yaml --profile coverage.out --output .github/coverage-badge.svg
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/coverage-badge.svg
            git diff --cached --quiet || git commit -m "ci: update coverage badge [skip ci]" && git push
          else
            echo "coverctl not available, skipping badge update"
          fi

  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run vet
        run: go vet ./...

      - name: Build binary
        run: make build

      - name: Run nox self-scan
        run: ./nox scan . --format all --output nox-results --quiet || true

      - name: Generate security badges
        run: ./nox badge --input nox-results/findings.json --output .github/nox-badge.svg --by-severity || true

      - name: Update security badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/nox-badge.svg .github/nox-critical.svg .github/nox-high.svg .github/nox-medium.svg .github/nox-low.svg
          git diff --cached --quiet || git commit -m "ci: update security badges [skip ci]" && git push

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-results/results.sarif
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- best-effort SARIF upload

      - name: Upload scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: nox-results
          path: nox-results/
          if-no-files-found: warn

      - name: Run benchmarks
        run: go test -bench . -benchtime 1x -run ^$ ./core/ | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: warn

      - name: Build Docker image (no push)
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t nox:ci .

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Fuzz rule engine
        run: go test -fuzz FuzzScanFile -fuzztime 30s -timeout 120s ./core/rules/

      - name: Fuzz keyword matching
        run: go test -fuzz FuzzContainsAnyKeyword -fuzztime 30s -timeout 120s ./core/rules/

      - name: Fuzz secrets analyzer
        run: go test -fuzz FuzzScanArtifacts -fuzztime 30s -timeout 120s ./core/analyzers/secrets/

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: write # nox:ignore IAC-314 -- needed for badge commits and SARIF upload
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.7.2
          only-new-issues: true

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs use ubuntu only (macOS = 10x, Windows = 2x Actions minutes
        # on public repos). Push to main keeps full cross-OS coverage.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func coverage.out

      - name: Install coverctl
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/pterm/coverctl@latest
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- optional tool, non-blocking

      - name: Check coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: coverctl check --config .coverctl.yaml --profile coverage.out
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- advisory threshold check

      - name: Update coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if command -v coverctl &>/dev/null; then
            coverctl badge --config .coverctl.yaml --profile coverage.out --output .github/coverage-badge.svg
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/coverage-badge.svg
            git diff --cached --quiet || git commit -m "ci: update coverage badge [skip ci]" && git push
          else
            echo "coverctl not available, skipping badge update"
          fi

  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run vet
        run: go vet ./...

      - name: Build binary
        run: make build

      - name: Run nox self-scan
        # NOTE: Go's flag.Parse stops at the first positional argument,
        # so the path MUST come last. `nox scan . --vex foo` silently
        # ignores everything after the path.
        # Best-effort full scan for SARIF + artifact upload; severity gating
        # happens in the dedicated `pr-gate` job below.
        run: ./nox scan --format all --output nox-results --vex vex.json --quiet . || true

      # Badge generation + push lives in .github/workflows/badge.yml
      # — it runs on a schedule and opens a PR, bypassing the
      # branch-protection rule that blocks GITHUB_TOKEN pushes to main.

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-results/results.sarif
        continue-on-error: true # nox:ignore IAC-018,IAC-310 -- best-effort SARIF upload

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nox-results
          path: nox-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Run benchmarks
        run: go test -bench . -benchtime 1x -run ^$ ./core/ | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build Docker image (no push)
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t nox:ci .

  pr-gate:
    name: Nox PR Gate (high/critical)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # nox needs git history for --changed-since

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build nox
        run: make build

      - name: Scan changed files only
        # Path is the LAST positional arg by design; do not move it.
        run: |
          ./nox scan \
            --format sarif,json \
            --output nox-pr \
            --vex vex.json \
            --severity-threshold high \
            --changed-since "origin/${{ github.base_ref }}" \
            --quiet \
            .

      - name: Upload SARIF (PR-scoped)
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-pr/results.sarif
          category: nox-pr
        continue-on-error: true

      - name: Upload PR scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nox-pr-results
          path: nox-pr/
          retention-days: 7

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Fuzz rule engine
        run: go test -fuzz FuzzScanFile -fuzztime 30s -timeout 120s ./core/rules/

      - name: Fuzz keyword matching
        run: go test -fuzz FuzzContainsAnyKeyword -fuzztime 30s -timeout 120s ./core/rules/

      - name: Fuzz secrets analyzer
        run: go test -fuzz FuzzScanArtifacts -fuzztime 30s -timeout 120s ./core/analyzers/secrets/

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # nox:ignore IAC-314 -- needed for creating GitHub releases
  packages: write # nox:ignore IAC-315 -- pushing the release image to ghcr.io (needed for pushing to ghcr.io)
  id-token: write # nox:ignore IAC-306 -- OIDC is the keyless-signing mechanism; removing it unsigns the release (needed for cosign keyless signing)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.22.0

      # Probe the Homebrew tap credential BEFORE running goreleaser.
      #
      # WHY: publishing the tap formula is a packaging convenience, but it ran
      # inside the same goreleaser invocation as everything else, so when the
      # token expired the whole `release` job failed — and `sign`, `docker` and
      # `update-major-tag` all declare `needs: release`, so they were SKIPPED.
      #
      # The result (observed on v1.9.0): binaries and SBOMs published, but the
      # artifacts left UNSIGNED, no container image, and the floating `v1` tag
      # not moved. A stale packaging token silently downgraded the
      # supply-chain guarantees this project exists to provide. That is exactly
      # backwards, and it failed loudly in the wrong place: the release looked
      # "failed" while actually being published-but-unsigned.
      #
      # Now a bad tap token degrades to a warning and a skipped formula update.
      # Signing is never collateral damage.
      - name: Check Homebrew tap credential
        id: tap
        run: |
          if gh api repos/felixgeelhaar/homebrew-tap --silent 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Homebrew tap skipped::TAP_GITHUB_TOKEN cannot access felixgeelhaar/homebrew-tap (rotate the secret and re-run to publish the formula). The release itself, signing and the container image are unaffected."
          fi
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SKIP_BREW: ${{ steps.tap.outputs.skip }}

  update-major-tag:
    # Move the floating `v1` action tag to this release so `nox-hq/nox@v1`
    # always resolves to the latest released action.yml (and binary).
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move v1 floating action tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa v1 -m "v1 -> ${GITHUB_REF_NAME}"
          git push origin v1 --force

  sign:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'checksums.txt' \
            --dir /tmp/release

      - name: Sign checksums with cosign (keyless)
        run: |
          # Newer cosign defaults to the new bundle format and ignores
          # --output-signature / --output-certificate. Emit only the
          # bundle. Verifiers use:
          #   cosign verify-blob --bundle checksums.txt.sig.bundle \
          #     --new-bundle-format \
          #     --certificate-identity-regexp "..." \
          #     --certificate-oidc-issuer "..." \
          #     checksums.txt
          cosign sign-blob /tmp/release/checksums.txt \
            --bundle /tmp/release/checksums.txt.sig.bundle \
            --yes

      - name: Attach signature to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            /tmp/release/checksums.txt.sig.bundle \
            --clobber

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch image
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nox-hq/nox:${{ steps.version.outputs.version }}
            ghcr.io/nox-hq/nox:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/nox-hq/nox@${{ steps.docker-build.outputs.digest }}

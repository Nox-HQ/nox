name: Nox Remediation

# Thin caller for the org-wide reusable workflow. Everything real — the pinned
# nox version, the scan/fix/verify sequence, the token fallback — lives in
# Nox-HQ/.github so a version bump happens once for every repository instead of
# 21 times.
#
# Action-pin remediation additionally needs a NOX_TOKEN secret: the default
# GITHUB_TOKEN cannot push changes under .github/workflows, and that scope is
# not grantable through `permissions:`. Without it this still remediates
# dependencies in full.
on:
  schedule:
    # Weekly Mon 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch: # nox:ignore IAC-308,IAC-155 -- remediation is run on demand as well as on schedule; it opens a PR, which is where review happens
    inputs:
      include-major:
        description: 'Apply major-version bumps too (off by default; review manually).'
        type: boolean
        default: false

permissions:
  contents: write # nox:ignore IAC-314 -- opens the remediation PR
  pull-requests: write

jobs:
  remediate:
    uses: Nox-HQ/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit
    with:
      include-major: ${{ inputs.include-major || false }}
      # nox's own suite is the gate on its own dependency upgrades.
      verify-cmd: 'go test ./... -count=1'
      # TEMPORARILY OFF. nox now keeps its own dependencies current (Dependabot
      # was removed), but the currency pass does not yet check the version it
      # upgrades TO against known advisories: it would move grpc 1.83.2 ->
      # 1.84.0, which is affected by GO-2026-6443 while 1.83.2 is patched —
      # the exact regression Dependabot shipped in #699. The security pass
      # (VULN-001 fixed_in) still runs. Turn this back on, and pin nox-version
      # here, once a nox release refuses a vulnerable upgrade target.
      outdated-fixes: false

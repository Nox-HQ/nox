name: Publish Homebrew Cask

# Republishes the tap cask for an already-published release.
#
# WHY THIS EXISTS SEPARATELY. The Homebrew step in release.yml is guarded: if
# TAP_GITHUB_TOKEN cannot reach the tap it warns, sets SKIP_BREW=true and lets
# the release continue, so signing, provenance and the container image are not
# held hostage to a expired PAT. That is the right trade, and it happened for
# real on v1.20.0 — everything shipped except the formula, on a fully green run.
#
# The gap was that nothing could then finish the job: release.yml triggers only
# on `push: tags: v*`, so the only way to retry was to re-push a tag.
#
# GoReleaser publishes a cask (Casks/nox.rb), not a formula: `brews` is
# deprecated. This workflow writes the same cask. It does not touch the old
# Formula/nox.rb; retiring that is a manual step in the tap.
#
# WHY NOT workflow_dispatch ON release.yml. That job runs
# `goreleaser release --clean`, which recreates the GitHub release. The SLSA
# provenance (multiple.intoto.jsonl) is uploaded AFTERWARDS by a different
# workflow, so re-running the release for an existing tag risks destroying an
# attestation that nothing would then regenerate. This workflow never touches
# the release; it only reads its checksums.
on:
  workflow_dispatch: # nox:ignore IAC-308 -- republishing a cask for an existing release is the whole point
    inputs:
      tag:
        description: "Release tag to publish the cask for (e.g. v1.20.0)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Publishes the tap cask users install from, so a manual run waits for
    # maintainer approval in the protected `release` environment (IAC-155).
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository (for the renderer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the cask from the release's own checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Read hashes from the published checksums.txt rather than
          # recomputing them: that file is what cosign signed, so it is the
          # artifact of record. A mismatch here would mean the release itself
          # is inconsistent, and `brew` would fail the install anyway.
          curl -fsSL -o checksums.txt \
            "https://github.com/nox-hq/nox/releases/download/${TAG}/checksums.txt"

          # The renderer emits what GoReleaser's homebrew_casks emits (pinned
          # in release.yml); it is a script so it can be diffed locally against
          # `goreleaser release --snapshot`.
          scripts/render-homebrew-cask.sh "${TAG}" checksums.txt > nox.rb

          ruby -c nox.rb

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: felixgeelhaar/homebrew-tap
          # The default GITHUB_TOKEN has no access to another repository, so a
          # missing or expired TAP_GITHUB_TOKEN fails HERE, loudly, rather than
          # silently publishing nothing. That is the opposite of the release
          # path's behaviour on purpose: this workflow's only job is the
          # cask, so there is nothing else to protect by degrading.
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
          persist-credentials: true

      - name: Commit if the cask changed
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cp nox.rb tap/Casks/nox.rb
          cd tap
          git add Casks/nox.rb
          # --cached: the cask may be new, and a plain `git diff` ignores
          # untracked files, which would report "nothing to publish".
          if git diff --cached --quiet; then
            echo "Cask already at ${TAG}; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brew cask update for nox version ${TAG}"
          git push

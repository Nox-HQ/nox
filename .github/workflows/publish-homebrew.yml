name: Publish Homebrew Formula

# Republishes the tap formula for an already-published release.
#
# WHY THIS EXISTS SEPARATELY. The Homebrew step in release.yml is guarded: if
# TAP_GITHUB_TOKEN cannot reach the tap it warns, sets SKIP_BREW=true and lets
# the release continue, so signing, provenance and the container image are not
# held hostage to a expired PAT. That is the right trade, and it happened for
# real on v1.20.0 — everything shipped except the formula, on a fully green run.
#
# The gap was that nothing could then finish the job: release.yml triggers only
# on `push: tags: v*`, so the only way to retry was to re-push a tag.
#
# WHY NOT workflow_dispatch ON release.yml. That job runs
# `goreleaser release --clean`, which recreates the GitHub release. The SLSA
# provenance (multiple.intoto.jsonl) is uploaded AFTERWARDS by a different
# workflow, so re-running the release for an existing tag risks destroying an
# attestation that nothing would then regenerate. This workflow never touches
# the release; it only reads its checksums.
on:
  workflow_dispatch: # nox:ignore IAC-308 -- republishing a formula for an existing release is the whole point
    inputs:
      tag:
        description: "Release tag to publish the formula for (e.g. v1.20.0)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Render the formula from the release's own checksums
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Read hashes from the published checksums.txt rather than
          # recomputing them: that file is what cosign signed, so it is the
          # artifact of record. A mismatch here would mean the release itself
          # is inconsistent, and `brew` would fail the install anyway.
          curl -fsSL -o checksums.txt \
            "https://github.com/nox-hq/nox/releases/download/${TAG}/checksums.txt"

          sha_for() {
            local f="nox_${version}_$1.tar.gz"
            local h
            h=$(grep -E "  ${f}\$" checksums.txt | awk '{print $1}')
            if [ -z "$h" ]; then
              echo "::error::${f} is not listed in ${TAG} checksums.txt" >&2
              exit 1
            fi
            printf '%s' "$h"
          }

          {
            echo '# typed: false'
            echo '# frozen_string_literal: true'
            echo ''
            echo '# This file was generated by GoReleaser. DO NOT EDIT.'
            echo 'class Nox < Formula'
            echo '  desc "Language-agnostic security scanner with first-class AI application security"'
            echo '  homepage "https://github.com/nox-hq/nox"'
            echo "  version \"${version}\""
            echo '  license "Apache-2.0"'
            echo ''
            echo '  on_macos do'
            for arch in amd64 arm64; do
              [ "$arch" = amd64 ] && cpu='Hardware::CPU.intel?' || cpu='Hardware::CPU.arm?'
              echo "    if ${cpu}"
              echo "      url \"https://github.com/nox-hq/nox/releases/download/${TAG}/nox_${version}_darwin_${arch}.tar.gz\""
              echo "      sha256 \"$(sha_for "darwin_${arch}")\""
              echo ''
              echo '      define_method(:install) do'
              echo '        bin.install "nox"'
              echo '      end'
              echo '    end'
            done
            echo '  end'
            echo ''
            echo '  on_linux do'
            for arch in amd64 arm64; do
              [ "$arch" = amd64 ] && cpu='Hardware::CPU.intel? && Hardware::CPU.is_64_bit?' || cpu='Hardware::CPU.arm? && Hardware::CPU.is_64_bit?'
              echo "    if ${cpu}"
              echo "      url \"https://github.com/nox-hq/nox/releases/download/${TAG}/nox_${version}_linux_${arch}.tar.gz\""
              echo "      sha256 \"$(sha_for "linux_${arch}")\""
              echo '      define_method(:install) do'
              echo '        bin.install "nox"'
              echo '      end'
              echo '    end'
            done
            echo '  end'
            # `brew test` block, byte-for-byte what GoReleaser emits. Dropping
            # it would quietly downgrade the formula on every republish.
            echo ''
            echo '  test do'
            echo '    system "#{bin}/nox", "--help"'
            echo '  end'
            echo 'end'
          } > nox.rb

          ruby -c nox.rb

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: felixgeelhaar/homebrew-tap
          # The default GITHUB_TOKEN has no access to another repository, so a
          # missing or expired TAP_GITHUB_TOKEN fails HERE, loudly, rather than
          # silently publishing nothing. That is the opposite of the release
          # path's behaviour on purpose: this workflow's only job is the
          # formula, so there is nothing else to protect by degrading.
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
          persist-credentials: true

      - name: Commit if the formula changed
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cp nox.rb tap/Formula/nox.rb
          cd tap
          if git diff --quiet; then
            echo "Formula already at ${TAG}; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nox.rb
          git commit -m "Brew formula update for nox version ${TAG}"
          git push

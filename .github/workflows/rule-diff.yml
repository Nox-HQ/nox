# Diff rule behaviour on REAL repositories between the last release and this PR.
#
# WHY: nox's corpus precision is measured at 1.00, and that number does not
# predict behaviour on real repositories. A sweep of ~270 baselined findings
# across a fleet found the secret and AI rules producing 13 false positives out
# of 13, while VULN-001 and IAC-013 were 21 real out of 23. Synthetic fixtures
# cannot show that, because they contain exactly what the rule author expected.
#
# Every rule-precision regression shipped so far was invisible until someone
# upgraded and noticed by hand. This makes the change visible at review time.
name: Rule behaviour diff

on:
  pull_request:
    paths:
      - 'core/analyzers/**'
      - 'core/rules/**'
      # The taint engine and the lexer that feeds it change rule behaviour just
      # as directly as an analyzer does, and were outside this filter: a run of
      # taint-model PRs shipped without this job ever firing, and one of them
      # carried a false-positive class that every precision suite scored 1.00 on.
      - 'core/taint/**'
      - 'core/lexctx/**'
      - 'scripts/rule-diff.sh'
      - 'scripts/rule-diff-corpus.json'
      # The ledger decides whether a negative delta passes, so a PR that only
      # edits it still has to prove the entries match reality.
      - 'scripts/rule-deltas.json'
      - '.github/workflows/rule-diff.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # nox:ignore IAC-309 -- PR-only, grouped per ref: a newer push supersedes the old diff

jobs:
  diff:
    name: Rule behaviour diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build candidate
        run: go build -o /tmp/nox-candidate ./cli

      - name: Fetch last released nox as the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        # Authenticated and retried. Both requests used to be anonymous curl, so
        # they shared the 60-per-hour budget of every job on the runner's IP and
        # failed on a 403 throttle (seen on #687) -- turning the gate red for a
        # reason that says nothing about rules. The same fix nox's own action
        # needed for the same throttle.
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed; retrying" >&2; sleep $((i * 10)); done; return 1; }
          tag="$(retry gh release view --repo nox-hq/nox --json tagName -q .tagName)"
          ver="${tag#v}"
          echo "baseline: $tag"
          tmp="$(mktemp -d)"
          retry gh release download "$tag" --repo nox-hq/nox \
            --pattern "nox_${ver}_linux_amd64.tar.gz" --output "$tmp/nox.tar.gz" --clobber
          tar xzf "$tmp/nox.tar.gz" -C "$tmp"
          mv "$tmp/nox" /tmp/nox-baseline
          /tmp/nox-baseline version
          # The ledger declares which release its entries are written against.
          # Handing the tag over lets the harness reject a ledger left behind by
          # a release, instead of matching entries against a comparison nobody
          # is making.
          echo "RULE_DIFF_BASELINE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Diff rule behaviour
        id: diff
        run: |
          set +e
          # $? after a pipe is tee's status, not the script's -- reading it
          # would report success no matter what the harness found.
          ./scripts/rule-diff.sh /tmp/nox-baseline /tmp/nox-candidate | tee /tmp/diff.txt
          code="${PIPESTATUS[0]}"
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Report
        # Exit 2 means a scan did not RUN -- unambiguous, so it fails the job.
        #
        # Exit 1 means rule behaviour changed AND every negative delta is
        # accounted for in scripts/rule-deltas.json. That is deliberately NOT a
        # failure: most rule PRs change behaviour on purpose, and a check that
        # goes red every time it works correctly is one people learn to ignore.
        # The delta lands in the job summary for the reviewer.
        #
        # Exit 3 is new, and it IS a failure: a rule removed findings from a
        # real repository with nothing saying why, or the ledger describes a
        # drop that no longer happens. Reporting alone could not tell a fix
        # from a hidden vulnerability -- both print as a smaller number -- so
        # the direction that can hide a vulnerability now has to be argued in
        # writing before it merges. Milestone 0.4.
        if: always()
        run: |
          code="${{ steps.diff.outputs.code }}"
          {
            echo "## Rule behaviour vs last release"
            echo
            echo '```'
            cat /tmp/diff.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            0) echo "No rule-level change on the corpus." ;;
            1) echo "::notice title=Rule behaviour changed::Every negative delta is accounted for in scripts/rule-deltas.json. Review the summary and confirm each reason is the real one." ;;
            3) echo "::error title=Unexplained narrowing::A rule removed findings from a real repository with no entry in scripts/rule-deltas.json, or an entry no longer describes a real drop. See the job summary."
               exit 1 ;;
            *) echo "::error title=Rule diff could not run::The harness failed (exit $code) -- a scan produced no findings.json, or the corpus is unusable. This check verified nothing."
               exit 1 ;;
          esac

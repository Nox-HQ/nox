scan:
  exclude:
    - "plugins/"
    - "dist/"
    - "*_test.go"
    # Intentionally-vulnerable ground-truth samples for `nox bench --precision`
    # (hardcoded secret, eval injection, prompt concat). The precision harness
    # scans this dir explicitly; the default self-scan must not flag them.
    # Lockfiles vendored from real projects to test the dependency parsers.
    # They pin real, sometimes vulnerable versions — which nox now parses and
    # correctly reports. Those are the fixtures' dependencies, not nox's, so
    # scanning them reports vulnerabilities nox does not have. Same rationale as
    # the precision corpora below.
    - "core/analyzers/deps/testdata/lockfiles/"
    - "testdata/precision-corpus/"
    - "testdata/precision-suite/"
    # The hard refutation corpus: five real flows a static analysis cannot
    # follow, so every file is deliberately vulnerable. They exist to test that
    # nox REFUSES to refute what it cannot see (see the corpus README and
    # core/refutation_hard_test.go), and the self-scan must not flag fixtures.
    - "testdata/refutation-hard/"
    # Intentionally finding-bearing inputs for the metamorphic corpus oracle
    # (scripts/metamorphic/sweep.py). Same rationale as the precision corpora:
    # the sweep scans them explicitly in isolated temp dirs; the self-scan must
    # not flag them. See scripts/metamorphic/README.md.
    - "testdata/metamorphic-corpus/"
    # Intentionally-vulnerable ground-truth apps for the `nox confirm` static→
    # dynamic loop: the vulnerable one splices untrusted input into the SYSTEM
    # role (the exact AGENTFLOW-001/TAINT-AI-001 anti-pattern), and both carry a
    # test canary. They exist to be flagged and then dynamically confirmed; the
    # entrypoint-parser test scans them explicitly. Same rationale as the
    # precision corpora — the self-scan must not flag fixtures. Python has no
    # inline nox:ignore for the multiple rules involved, so the dir is excluded.
    - "core/confirm/testdata/"
    - "testdata/precision-suite-php/"
    - "testdata/precision-suite-java/"
    - "testdata/precision-suite-ruby/"
    - "testdata/precision-suite-rust/"
    - "testdata/precision-suite-csharp/"
    - "testdata/precision-suite-cpp/"
    - "testdata/precision-suite-perl/"
    - "testdata/precision-suite-scala/"
    - "testdata/precision-suite-kotlin/"
    - "testdata/precision-suite-shell/"
    - "testdata/precision-suite-powershell/"
    - "testdata/precision-suite-swift/"
    - "testdata/precision-suite-objc/"
    - "testdata/precision-suite-lua/"
    - "testdata/precision-suite-clojure/"
    - "testdata/precision-suite-elixir/"
    - "testdata/precision-suite-dart/"
    - "testdata/precision-suite-groovy/"
    # The refutation suite (Gate A, docs/design/evidence-native-nox.md). Same
    # rationale as the precision corpora, with one difference worth stating: its
    # samples are chosen to LOOK suppressible, and two carry live-format
    # credentials bound to identifiers that say EXAMPLE — precisely so that a
    # future value-semantics refiner cannot dismiss them on the name. The
    # refutation harness scans this dir explicitly; the self-scan must not.
    - "testdata/refutation-suite/"
    # The reachability suite (Gate B, docs/design/evidence-native-nox.md). Its
    # `reachable` case imports crypto/md5 on purpose — the whole case is "the
    # affected package IS linked", and an advisory scoping to a weak-crypto
    # stdlib package is what makes it a realistic one. The suite is scored by
    # its own test, which reads the modules directly; the self-scan must not
    # flag a fixture for containing exactly what it was built to contain.
    - "testdata/reachability-suite/"
    - ".relicta/"
    - ".cover/"
    - ".roady/"
    - "scripts/"
    # Rule definition files contain high-entropy regex patterns (expected false positives)
    - "core/analyzers/secrets/rules.go"
    # The taint sink catalog is a static list of API names. Long camel-case
    # identifiers (NSKeyedUnarchiver.unarchiveTopLevelObjectWithData) score as
    # high-entropy strings. JSON carries no comments, so an inline nox:ignore
    # is not available for this one file.
    - "core/taint/data/catalog.json"
    - "core/analyzers/iac/rules*.go"
    - "core/analyzers/ai/rules.go"
    - "registry/trust/signature.go"
    - "cli/plugin_cmd.go"
    - "action-pr-comment.sh"
    - "action.sh"
    # Deliberately-unsafe example configs. mcp.json carries a literal
    # GitHub-token-shaped string whose own value tells the reader not to do
    # this, and vex.json is a sample waiver document; both are JSON, which
    # cannot carry an inline nox:ignore. Scoped to the two files rather than
    # the examples/ tree, so every other example stays scanned. (The token is
    # deliberately not quoted here — writing it into this file made nox report
    # a real SEC-003 against the config itself.)
    - "examples/ai-app/mcp.json"
    - "examples/ci-baseline/vex.json"
    # Documentation files contain example code snippets with token references
    - "docs/*.md"
    - "README.md"
    - "CHANGELOG.md"

  # The secrets analyzer, and only it, is held off the CI workflows.
  #
  # This replaces a blanket `.github/workflows/*.yml` entry in scan.exclude
  # above. That exclusion was added for one narrow reason — pinned commit SHAs
  # and GITHUB_TOKEN references read as high-entropy secrets — but excluding the
  # FILE silenced every analyzer on it, not just the noisy one. The cost was 19
  # active IaC findings on nox's own workflows that no self-scan and no CI gate
  # could see, including a high-severity IAC-013: nox-remediate-action was
  # pinned to the mutable @v1 tag, which is exactly the supply-chain weakness
  # nox ships a rule to detect. A scanner blind to its own CI is the one place
  # it cannot afford to be.
  #
  # Scoped rather than deleted. The secrets analyzer currently reports nothing
  # on these files, so this may already be unnecessary — but the entropy
  # false positives it was written for are a real property of workflow files,
  # and re-earning them by deleting the guard is not worth the noise. It is kept
  # narrow so it can only ever silence the analyzer it names.
  analyzer_rules:
    - analyzer: secrets
      paths:
        - ".github/workflows/*.yml"
      rules: ["*"]
      action: skip_analyzer

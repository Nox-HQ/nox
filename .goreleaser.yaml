# GoReleaser configuration for Nox
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: nox
    binary: nox
    main: ./cmd/nox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

# Sign and notarize the darwin binaries with Apple's Developer ID, through
# quill (cross-platform, so the Linux runner does it). Off until the signing
# secrets exist: a release without them builds exactly as before.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - nox
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        # Wait, so a rejected submission fails the release instead of
        # shipping a binary Gatekeeper will refuse. 20m is Apple's cap.
        wait: true
        timeout: 20m

archives:
  - id: nox-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance Improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: 'Refactoring'
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: nox-hq
    name: nox
  draft: false
  prerelease: auto
  mode: replace
  name_template: "Release {{.Tag}}"
  header: |
    ## Nox {{ .Tag }} ({{ .Date }})

    Language-agnostic security scanner with first-class AI application security.

    ### Installation

    #### macOS/Linux (Homebrew)
    ```bash
    brew tap felixgeelhaar/tap
    brew install nox
    ```

    #### Direct Download
    Download the appropriate archive for your platform from the assets below.

    ### What's Changed
  footer: |
    **Full Changelog**: https://github.com/nox-hq/nox/compare/{{ .PreviousTag }}...{{ .Tag }}

# Homebrew cask. GoReleaser deprecated `brews` (formulas) for pre-built
# binaries in favour of casks (deprecations: brews, hard since v2.16).
homebrew_casks:
  - name: nox
    directory: Casks
    repository:
      owner: felixgeelhaar
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com # nox:ignore DATA-001 -- goreleaser bot email
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/nox-hq/nox"
    description: "Language-agnostic security scanner with first-class AI application security"
    license: "Apache-2.0"
    # The darwin binaries are signed with the Developer ID and notarized when
    # MACOS_SIGN_P12 is set (the notarize block above), and Gatekeeper then
    # accepts them as installed, quarantine and all (macOS signing check,
    # run 42089842854: "source=Notarized Developer ID"). Only a release built
    # without the signing secrets ships binaries Gatekeeper refuses ("nox is
    # damaged and cannot be opened"); for that one the cask strips the
    # quarantine bit, as GoReleaser's cask guide prescribes for un-notarized
    # builds. One switch decides both, so they cannot disagree.
    hooks:
      post:
        install_steps: |
          {{- if not (isEnvSet "MACOS_SIGN_P12") }}
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/nox"]
          end
          {{- end }}
    # "auto" already skips prereleases/snapshots. SKIP_BREW additionally skips
    # when the release workflow found TAP_GITHUB_TOKEN cannot reach the tap, so
    # an expired packaging credential cannot fail the release and take cosign
    # signing down with it. Defaults to "auto" for local/manual runs where the
    # variable is unset.
    skip_upload: '{{ if eq (envOrDefault "SKIP_BREW" "") "true" }}true{{ else }}auto{{ end }}'

# Each archive's SBOM is written by nox itself (`nox sbom`), built from this
# release's commit by release.yml. Until v1.58.0 this section named no command,
# so GoReleaser ran its default, syft. nox reads the archive offline and the Go
# binary inside from its embedded build info; SOURCE_DATE_EPOCH pins the
# document's creation time to the commit, so the SBOM is reproducible.
sboms:
  - artifacts: archive
    ids:
      - nox-archive
    cmd: nox
    args: ["sbom", "$artifact", "-output", "$document"]
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    env:
      - SOURCE_DATE_EPOCH={{ .CommitTimestamp }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"

metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'

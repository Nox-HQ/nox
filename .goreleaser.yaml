# GoReleaser configuration for Nox
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Pre-build the reachability plugin so the archive can ship it
    # alongside the nox binary. The plugin lives in its own module;
    # goreleaser's builds: stanza can't follow nested go.mod files
    # directly, so a pre-hook produces the sibling artifact which the
    # archive includes via files:. Output goes to top-level `bundled/`
    # — recent GoReleaser asserts dist/ is empty after before-hooks
    # run, so we cannot land artifacts there ahead of the build phase.
    - mkdir -p bundled
    # Build the bundled plugin from its PUBLISHED module, not from a copy in
    # this tree.
    #
    # It used to build from plugins/nox-plugin-reachability, which had forked
    # from the repository that actually releases this plugin -- so the
    # reachability shipped inside the nox archive was different code from the
    # reachability published under the same name and version. Sourcing the
    # released module makes the bundled binary and the standalone release the
    # same artifact by construction.
    - sh -c 'GOFLAGS=-trimpath CGO_ENABLED=0 GOBIN=$(pwd)/bundled go install -ldflags="-s -w" github.com/nox-hq/nox-plugin-reachability@v0.7.0'

builds:
  - id: nox
    binary: nox
    main: ./cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: nox-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      # Bundle the reachability plugin so vulnerable-dep call-graph
      # analysis works out of the box without a separate plugin
      # install. Built by the pre-hook above into bundled/.
      - src: bundled/nox-plugin-reachability
        dst: bin/nox-plugin-reachability

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance Improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: 'Refactoring'
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: nox-hq
    name: nox
  draft: false
  prerelease: auto
  mode: replace
  name_template: "Release {{.Tag}}"
  header: |
    ## Nox {{ .Tag }} ({{ .Date }})

    Language-agnostic security scanner with first-class AI application security.

    ### Installation

    #### macOS/Linux (Homebrew)
    ```bash
    brew tap felixgeelhaar/tap
    brew install nox
    ```

    #### Direct Download
    Download the appropriate archive for your platform from the assets below.

    ### What's Changed
  footer: |
    **Full Changelog**: https://github.com/nox-hq/nox/compare/{{ .PreviousTag }}...{{ .Tag }}

brews:
  - name: nox
    directory: Formula
    repository:
      owner: felixgeelhaar
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}" # nox:ignore SEC-163 -- Go template using env var
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com # nox:ignore DATA-001 -- goreleaser bot email
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/nox-hq/nox"
    description: "Language-agnostic security scanner with first-class AI application security"
    license: "Apache-2.0"
    install: |
      bin.install "nox"
      bin.install "bin/nox-plugin-reachability"
    test: |
      system "#{bin}/nox", "--help"
      system "#{bin}/nox-plugin-reachability", "--help" rescue true
    # "auto" already skips prereleases/snapshots. SKIP_BREW additionally skips
    # when the release workflow found TAP_GITHUB_TOKEN cannot reach the tap, so
    # an expired packaging credential cannot fail the release and take cosign
    # signing down with it. Defaults to "auto" for local/manual runs where the
    # variable is unset.
    skip_upload: '{{ if eq (envOrDefault "SKIP_BREW" "") "true" }}true{{ else }}auto{{ end }}'

sboms:
  - artifacts: archive
    ids:
      - nox-archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'

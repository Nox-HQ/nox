name: Deploy
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/build-push-action@0788c444d8b4d67580213712e34a148cae3a6c4e # v6.18.0
      - run: ./scripts/publish.sh

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoicely
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts: [invoicely.example.com]
      secretName: invoicely-tls
  rules:
    - host: invoicely.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: invoicely, port: {number: 3000}}}

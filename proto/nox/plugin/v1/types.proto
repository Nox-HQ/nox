syntax = "proto3";

package nox.plugin.v1;

option go_package = "github.com/nox-hq/nox/gen/nox/plugin/v1;pluginv1";

// Severity represents the impact level of a security finding.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_CRITICAL = 1;
  SEVERITY_HIGH = 2;
  SEVERITY_MEDIUM = 3;
  SEVERITY_LOW = 4;
  SEVERITY_INFO = 5;
}

// Confidence represents the certainty level of a finding.
enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_HIGH = 1;
  CONFIDENCE_MEDIUM = 2;
  CONFIDENCE_LOW = 3;
}

// ArtifactType classifies discovered files and components.
enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  ARTIFACT_TYPE_SOURCE = 1;
  ARTIFACT_TYPE_CONFIG = 2;
  ARTIFACT_TYPE_LOCKFILE = 3;
  ARTIFACT_TYPE_CONTAINER = 4;
  ARTIFACT_TYPE_AI_COMPONENT = 5;
  ARTIFACT_TYPE_UNKNOWN = 6;
}

// Location identifies a region within a source file.
message Location {
  string file_path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  int32 start_column = 4;
  int32 end_column = 5;
}

// Finding represents a single security finding produced by an analyzer.
message Finding {
  string id = 1;
  string rule_id = 2;
  Severity severity = 3;
  Confidence confidence = 4;
  Location location = 5;
  string message = 6;
  string fingerprint = 7;
  map<string, string> metadata = 8;
}

// Artifact represents a discovered file or component in the scan target.
message Artifact {
  string path = 1;
  string abs_path = 2;
  ArtifactType type = 3;
  int64 size = 4;
  bytes content = 5;
  string mime_type = 6;
}

// Package represents a software dependency.
message Package {
  string name = 1;
  string version = 2;
  string ecosystem = 3;
}

// AIComponent represents an AI-related component detected in the codebase.
message AIComponent {
  string name = 1;
  string type = 2;
  string path = 3;
  map<string, string> details = 4;
}

// NodeKind classifies graph nodes.
enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_RESOURCE = 1;     // IaC/cloud resource
  NODE_KIND_FUNCTION = 2;     // Code function/method
  NODE_KIND_DATA = 3;         // Data source/sink
  NODE_KIND_SERVICE = 4;      // Service/endpoint
  NODE_KIND_POLICY = 5;       // Policy/rule
}

// EdgeKind classifies graph edges.
enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_DEPENDS_ON = 1;    // Structural dependency
  EDGE_KIND_CALLS = 2;         // Function call
  EDGE_KIND_FLOWS_TO = 3;      // Data flow
  EDGE_KIND_EXPOSES = 4;       // Network exposure
  EDGE_KIND_REFERENCES = 5;    // Generic reference
}

// GraphNode represents a vertex in a relationship graph.
message GraphNode {
  string id = 1;
  NodeKind kind = 2;
  string label = 3;
  string file_path = 4;
  map<string, string> properties = 5;
}

// GraphEdge represents a directed edge between two graph nodes.
message GraphEdge {
  string source = 1;     // source node id
  string target = 2;     // target node id
  EdgeKind kind = 3;
  string label = 4;
  map<string, string> properties = 5;
}

// Graph is a labeled collection of nodes and edges.
message Graph {
  string name = 1;
  string description = 2;
  repeated GraphNode nodes = 3;
  repeated GraphEdge edges = 4;
}

// Enrichment annotates an existing finding with additional context
// without modifying the original finding fields. This preserves
// determinism of the core scan engine.
message Enrichment {
  string finding_fingerprint = 1;  // links to Finding.fingerprint
  string kind = 2;                 // e.g. "triage", "reachability", "explanation"
  string title = 3;
  string body = 4;                 // markdown content
  map<string, string> metadata = 5;
  Confidence confidence = 6;
  string source = 7;              // plugin name that produced it
}

// ScanContext carries core scan results to post-scan plugins.
message ScanContext {
  repeated Finding findings = 1;
  repeated Package packages = 2;
  repeated AIComponent ai_components = 3;
}
